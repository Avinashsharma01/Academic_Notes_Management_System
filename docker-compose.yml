services:
  mongo:
    image: mongo:7
    container_name: thecollege-mongo
    profiles: ["dev"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: thecollege-server
    profiles: ["dev"]
    env_file:
      - ./Server/.env.docker
    environment:
      - MONGO_URI=mongodb://mongo:27017/THE_COLLAGE
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    volumes:
      - ./Server:/app
      - /app/node_modules
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: thecollege-client
    profiles: ["dev"]
    env_file:
      - ./Client/.env.docker
    environment:
      - VITE_PROXY_TARGET=http://server:8080
      - VITE_API_URL=/api
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./Client:/app
      - /app/node_modules
    restart: unless-stopped

  mongo-prod:
    image: mongo:7
    container_name: thecollege-mongo-prod
    profiles: ["prod"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-prod-data:/data/db
    restart: unless-stopped

  server-prod:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: thecollege-server-prod
    profiles: ["prod"]
    env_file:
      - ./Server/.env.docker
    environment:
      - MONGO_URI=mongodb://mongo-prod:27017/THE_COLLAGE
      - FRONTEND_URL=http://localhost:4173
    depends_on:
      - mongo-prod
    ports:
      - "8080:8080"
    restart: unless-stopped

  client-prod:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: thecollege-client-prod
    profiles: ["prod"]
    depends_on:
      - server-prod
    ports:
      - "4173:80"
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-prod-data:
